name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'types/**'
      - 'styles/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.npmrc'
      - '.nvmrc'
      - 'next.config.*'
      - 'next-env.d.ts'
      - 'tsconfig.json'
      - 'postcss.config.*'
      - 'tailwind.config.*'
      - 'eslint.config.*'
      - 'vercel.json'
      - '.vercelignore'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Deployment environment (production requires main)
        type: choice
        required: true
        default: preview
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.event_name == 'push' && 'production' || inputs.target || 'preview' }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'AgoraIO-Community/agora-voice-shopping-assistant-demo' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOYMENT_TARGET: ${{ github.event_name == 'push' && 'production' || inputs.target || 'preview' }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NEXT_PUBLIC_AGORA_APP_ID: ${{ secrets.NEXT_PUBLIC_AGORA_APP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check deployment configuration
        run: |
          case "$DEPLOYMENT_TARGET" in
            preview) ;;
            production)
              if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
                echo '::error::Production deployment requires main; select preview for feature branches'
                exit 1
              fi
              ;;
            *) echo '::error::Unsupported deployment target'; exit 1 ;;
          esac
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN NEXT_PUBLIC_AGORA_APP_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Actions configuration: $name"
              exit 1
            fi
          done
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install Vercel CLI
        run: npm install --global vercel@58.4.4
      - name: Configure local project settings without pulling environment
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const settings = { nodeVersion: pkg.engines.node, rootDirectory: null };
          for (const key of ['framework', 'buildCommand', 'devCommand', 'installCommand', 'outputDirectory']) {
            if (config[key] !== undefined) settings[key] = config[key];
          }
          fs.mkdirSync('.vercel', { recursive: true });
          fs.writeFileSync('.vercel/project.json', JSON.stringify({
            projectId: process.env.VERCEL_PROJECT_ID,
            orgId: process.env.VERCEL_ORG_ID,
            projectName: pkg.name,
            settings,
          }, null, 2));
          NODE
      - name: Build deployment output
        run: |
          build_args=(--standalone)
          if [ "$DEPLOYMENT_TARGET" = production ]; then build_args+=(--prod); fi
          vercel build "${build_args[@]}" --token="$VERCEL_TOKEN"
      - name: Check that prebuilt output is self-contained
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const root = fs.realpathSync('.vercel/output');
          let functions = 0;
          for (const entry of fs.readdirSync(root, { recursive: true })) {
            const file = path.join(root, entry);
            if (fs.lstatSync(file).isSymbolicLink()) {
              const target = fs.realpathSync(file);
              assert.ok(target === root || target.startsWith(root + path.sep), `External build symlink: ${entry}`);
            }
            if (path.basename(file) !== '.vc-config.json') continue;
            const config = JSON.parse(fs.readFileSync(file, 'utf8'));
            assert.equal(Object.keys(config.filePathMap || {}).length, 0, `Unbundled function dependencies: ${entry}; build with --standalone`);
            if (config.handler) assert.ok(fs.existsSync(path.join(path.dirname(file), config.handler)), `Missing function handler: ${entry}`);
            functions++;
          }
          assert.ok(functions > 0, 'Expected server functions in prebuilt output');
          console.log(`Verified ${functions} self-contained functions`);
          NODE
      - name: Deploy prebuilt output
        id: publish
        run: |
          deploy_args=(--prebuilt --yes)
          if [ "$DEPLOYMENT_TARGET" = production ]; then deploy_args+=(--prod); fi
          deployment_url=$(vercel deploy "${deploy_args[@]}" --token="$VERCEL_TOKEN" \
            --meta "sourceCommit=$GITHUB_SHA" --meta "sourceRepo=$GITHUB_REPOSITORY")
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
      - name: Check the deployed page and server runtime
        env:
          DEPLOYMENT_URL: ${{ steps.publish.outputs.url }}
        run: |
          for route in / /api/generate-agora-token; do
            status=$(curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 60 \
              --output /dev/null --write-out '%{http_code}' "$DEPLOYMENT_URL$route")
            if [ "$status" != 200 ]; then
              echo "::error::Unexpected HTTP $status from deployment route $route"
              exit 1
            fi
          done
      - name: Check the public production page
        if: env.DEPLOYMENT_TARGET == 'production'
        run: curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --max-time 60 --output /dev/null https://agora-voice-shopping-assistant-demo.vercel.app
      - name: Record deployment
        env:
          DEPLOYMENT_URL: ${{ steps.publish.outputs.url }}
        run: |
          {
            echo "### Voice Shopping $DEPLOYMENT_TARGET deployment"
            echo "Source revision: $GITHUB_SHA"
            echo "Deployment: $DEPLOYMENT_URL"
            if [ "$DEPLOYMENT_TARGET" = production ]; then
              echo 'Production: https://agora-voice-shopping-assistant-demo.vercel.app'
            else
              echo 'Preview deployment; production domain was not promoted.'
            fi
            echo 'Deployed page and server token endpoint HTTP checks passed. Live voice and Shopify queries require separate acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
